name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: Engine + API tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: eagle_eye
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: eagle_eye/requirements-engine.txt
      - name: Install Tesseract OCR
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - name: Install Python dependencies (pinned engine set + PP-OCRv4 without the GUI OpenCV it asks for)
        run: |
          pip install -r requirements-engine.txt pytest httpx
          pip install --no-deps rapidocr-onnxruntime==1.4.4
      - name: Run tests
        run: python -m pytest tests -q

  web:
    name: Web console build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: eagle_eye/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eagle_eye/web/package-lock.json
      - run: npm ci
      - name: Historical inspection safety tests
        run: npm test
      - name: Type-check and build (local console)
        run: npm run build
      - name: Build the hosted console (cloud engine + recorded replays)
        run: npm run build:static
