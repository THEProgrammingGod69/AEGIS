# EAGLE EYE on-prem / local: the full console + engine in one container on http://localhost:8000.
#   docker compose up --build
# OCR and drawing checks execute locally. No hosted AI API is enabled.
# Real drawing sets and photos are mounted read-only from ./data/emerson.
services:
  eagle-eye:
    build:
      context: ./eagle_eye
      dockerfile: Dockerfile.engine
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      EAGLE_EYE_CLOUD: "0"
      EAGLE_OCR_WORKERS: ${EAGLE_OCR_WORKERS:-2}
      EAGLE_AGENT_ENABLED: "0"
    volumes:
      - ./data/emerson:/app/data/emerson:ro
      - eagle-eye-runs:/tmp/eagle_eye
    restart: unless-stopped
volumes:
  eagle-eye-runs:
