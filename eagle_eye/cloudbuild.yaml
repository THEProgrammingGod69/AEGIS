# Cloud Build: gcloud builds submit eagle_eye --config eagle_eye/cloudbuild.yaml --substitutions _IMAGE=<region>-docker.pkg.dev/<project>/eagle/engine:finale
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.engine", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/PROJECT/eagle/engine:finale
options:
  machineType: E2_HIGHCPU_8
